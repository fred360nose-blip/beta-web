<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fredflix</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .blocked-page {
      background: #ffffff;
      color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .blocked-container {
      max-width: 680px;
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .briefcase-img {
      width: 92px;
      height: auto;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      margin-top: 8px;
    }

    .content-area {
      text-align: left;
    }

    .blocked-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .hosted {
      font-size: 18px;
      color: #444444;
      margin-bottom: 25px;
    }

    .blocked-text {
      font-size: 15.2px;
      line-height: 1.55;
      color: #222222;
      margin-bottom: 35px;
    }

    .support-link {
      color: #0066cc;
      text-decoration: underline;
      cursor: pointer;
    }

    .btn-close {
      background: #f1f1f1;
      color: #000;
      border: 1px solid #c0c0c0;
      padding: 9px 28px;
      font-size: 15px;
      cursor: pointer;
      border-radius: 2px;
    }

    .btn-close:hover {
      background: #e5e5e5;
    }

    .footer {
      margin-top: 70px;
      font-size: 13.5px;
      color: #666666;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Microsoft Defender Blocked Page -->
  <div class="blocked-page" id="blockedScreen">
    <div class="blocked-container">
